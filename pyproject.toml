[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
name = "cofferdb"
version = "0.1.1"
description = "Experimental, in-process embedded retrieval for local Python applications."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "bindings/python/licenses/**/*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
]

[project.urls]
Source = "https://github.com/maredengb/coffered"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "cofferdb._native"
python-source = "bindings/python/python"
bindings = "pyo3"
features = ["extension-module"]
locked = true
include = [
  { path = ".github/**/*", format = "sdist" },
  { path = "bindings/python/.gitignore", format = "sdist" },
]
